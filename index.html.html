    font-style: italic;
    color: #555;

</style>

<div class="container">
  <!-- 開始畫面 -->
  <div class="start-screen active" id="startScreen">
    <h1>🏆 學習重點1：第一次世界大戰<br>Learning Point 1: World War I</h1>
    <p class="subtitle">第一次世界大戰 / World War I</p>
    <div class="info">
      <strong>遊戲說明：</strong><br>
      • 共 20 選擇，涵蓋課本重點<br>
      • 每作答後即時顯示解釋<br>
      • 完成後可領取<strong>參與證書</strong><br>
      • 得分達 16 分或以上可再獲<strong>優異證書</strong><br>
      • 適合課後溫習或小組競賽
    </div>
    <div class="controls">
      <button class="btn" onclick="startQuiz()">開始挑戰！ Start!</button>
    </div>
  </div>

  <!-- 測驗畫面 -->
  <div class="quiz-screen" id="quizScreen">
    <div class="score-display">得分 / Score: <span id="score">0</span> / <span id="total">20</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div style="text-align:center; margin-bottom:10px;">第 / Q<span id="qNum">1</span> </div>
    <div class="category-tag" id="categoryTag"></div>
    <div class="question-box" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <div class="controls">
      <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>下一 Next</button>
    </div>
  </div>

  <!-- 結果畫面 -->
  <div class="result-screen" id="resultScreen">
    <h2>🎉 挑戰完成！ Challenge Completed!</h2>
    <div class="result-score" id="finalScore"></div>
    <p id="resultMessage"></p>
    <div style="margin:20px 0;">
      <label for="studentName" style="display:block; margin-bottom:8px; font-weight:bold;">請輸入姓名以領取證書 / Enter your name for the certificate:</label>
      <input type="text" id="studentName" class="name-input" placeholder="例如：陳同學" maxlength="20">
    </div>
    <div class="controls">
      <button class="btn" id="reviewBtn" onclick="reviewWrong()" style="display:none; background:#ff9800;">重溫錯題 Review Missed</button>
      <button class="btn" onclick="showCertificate('participation')">領取參與證書 Get Participation Certificate</button>
      <button class="btn btn-gold" id="excellenceBtn" onclick="showCertificate('excellence')" style="display:none;">領取優異證書 Get Excellence Certificate</button>
      <button class="btn" onclick="startQuiz()">再玩一次 Play Again</button>
    </div>
  </div>

  <!-- 證書畫面 -->
  <div class="cert-screen" id="certScreen">
    <div id="certificateContainer"></div>
    <div class="controls no-print">
      <button class="btn" onclick="window.print()">🖨️ 列印證書</button>
      <button class="btn" onclick="backToResult()">返回結果</button>
      <button class="btn" onclick="startQuiz()">再玩一次 Play Again</button>
    </div>
  </div>
</div>

let currentQuestion = 0;
let score = 0;
let answered = false;
let wrongAnswers = [];

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  answered = false;
  wrongAnswers = [];
  document.getElementById('startScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('certScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  document.getElementById('score').textContent = score;
  document.getElementById('studentName').value = '';
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQuestion];
  document.getElementById('qNum').textContent = currentQuestion + 1;
  document.getElementById('categoryTag').textContent = q.category;
  document.getElementById('questionText').innerHTML = q.q_zh + '<br><em style="color:#555;font-size:0.9em;">' + q.q_en + '</em>';
  document.getElementById('progressFill').style.width = ((currentQuestion) / questions.length * 100) + '%';
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options_zh.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = String.fromCharCode(65 + i) + '. ' + opt + '<br><em style="color:#666;font-size:0.85em;">' + q.options_en[i] + '</em>';
    div.onclick = () => selectOption(i);
    container.appendChild(div);
  });
  
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').disabled = true;
  answered = false;
}

function selectOption(index) {
  if (answered) return;
  answered = true;
  
  const q = questions[currentQuestion];
  const options = document.querySelectorAll('.option');
  options.forEach(opt => opt.classList.add('disabled'));
  
  if (index === q.answer) {
    score++;
    document.getElementById('score').textContent = score;
    options[index].classList.add('correct');
    showFeedback(true, q.explain_zh, q.explain_en);
  } else {
    options[index].classList.add('wrong');
    options[q.answer].classList.add('correct');
    showFeedback(false, q.explain_zh, q.explain_en);
    wrongAnswers.push(currentQuestion);
  }
  
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('progressFill').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
}

function showFeedback(isCorrect, explain_zh, explain_en) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  const msg = isCorrect 
    ? '✅ 答對了！ 很好！ Correct! Well done!' 
    : '❌ 答錯了，但沒關係，看解釋就明白了。 Incorrect, but that's okay—check the explanation.';
  fb.innerHTML = msg + 
    '<br><br><strong>解釋 / Explanation：</strong><br>' + explain_zh + 
    '<br><em style="color:#555;font-size:0.9em;">' + explain_en + '</em>';
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion >= questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('quizScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');
  document.getElementById('finalScore').textContent = score + ' / ' + questions.length;
  
  let msg = '';
  const percent = (score / questions.length) * 100;
  if (percent >= 90) msg = '🏆 優秀！你已充分掌握學習重點1的內容，可領取優異證書 Get Excellence Certificate！';
  else if (percent >= 80) msg = '👍 良好！表現出色，可領取優異證書 Get Excellence Certificate！';
  else if (percent >= 50) msg = '📖 合格。建議再溫習較弱部分後再挑戰。';
  else msg = '💪 還需努力！建議先重讀課本重點，再來挑戰。';
  
  document.getElementById('resultMessage').textContent = msg;
  
  // 16分或以上顯示優異證書按鈕
  const excellenceBtn = document.getElementById('excellenceBtn');
  if (score >= 16) {
    excellenceBtn.style.display = 'inline-block';
  } else {
    excellenceBtn.style.display = 'none';
  }
}

        <div class="cert-corner tl"></div>
        <div class="cert-corner tr"></div>
        <div class="cert-corner bl"></div>
        <div class="cert-corner br"></div>
        <div class="cert-ornament">✦ ✦ ✦</div>
        <div class="cert-header">參 與 證 書</div>
        <div class="cert-subtitle">Certificate of Participation</div>
        <div class="cert-body">
          茲證明
          <div class="cert-name">${name}</div>
          已完成「第一次世界大戰」溫習遊戲<br>
          <em>has completed the "World War I" Revision Game</em><br>
          得分 <span class="cert-score">${score} / 20（${percent}%）</span><br>
          積極參與歷史科溫習活動，特頒此證。<br>
          <em>For active participation in the History revision activity.</em>
        </div>
        <img src="${partSeal}" class="cert-seal-img" alt="參與印章">
        <div class="cert-footer">
          <div>中三歷史科<br>S3 History<br>課9 溫習活動</div>
          <div>日期：${today}</div>
        </div>
      </div>
    `;
  }
  
  document.getElementById('certificateContainer').innerHTML = html;
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('certScreen').classList.add('active');
}

function backToResult() {
  document.getElementById('certScreen').classList.remove('active');
  document.getElementById('resultScreen').classList.add('active');
}

function reviewWrong() {
  if (wrongAnswers.length === 0) return;
  // Start a mini review of wrong questions only
  currentQuestion = 0;
  // Temporarily use a filtered list
  window._reviewMode = true;
  window._reviewList = [...wrongAnswers];
  window._reviewIndex = 0;
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('quizScreen').classList.add('active');
  showReviewQuestion();
}

function showReviewQuestion() {
  if (window._reviewIndex >= window._reviewList.length) {
    alert('錯題重溫完成！可以再挑戰一次或領取證書。');
    document.getElementById('quizScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.add('active');
    window._reviewMode = false;
    return;
  }
  const qIndex = window._reviewList[window._reviewIndex];
  const q = questions[qIndex];
  document.getElementById('qNum').textContent = (window._reviewIndex + 1) + ' / ' + window._reviewList.length;
  document.getElementById('categoryTag').textContent = '重溫 / Review: ' + q.category;
  document.getElementById('questionText').innerHTML = q.q_zh + '<br><em style="color:#555;font-size:0.9em;">' + q.q_en + '</em>';
  document.getElementById('progressFill').style.width = ((window._reviewIndex) / window._reviewList.length * 100) + '%';
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options_zh.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = String.fromCharCode(65 + i) + '. ' + opt + '<br><em style="color:#666;font-size:0.85em;">' + q.options_en[i] + '</em>';
    div.onclick = () => {
      // Show correct answer immediately in review
      const options = document.querySelectorAll('.option');
      options.forEach(o => o.classList.add('disabled'));
      options[q.answer].classList.add('correct');
      showFeedback(true, q.explain_zh, q.explain_en);
      document.getElementById('nextBtn').disabled = false;
      document.getElementById('nextBtn').onclick = () => {
        window._reviewIndex++;
        showReviewQuestion();
      };
    };
    container.appendChild(div);
  });
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = '下一題 Next';
}

</script>
</body>
</html>
